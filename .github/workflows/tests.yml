name: Offline tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml pillow cryptography
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: lib self-checks
        run: |
          python3 custom_components/conga_map/lib/mapfile.py
          python3 -c "
import sys; sys.path.insert(0, 'custom_components/conga_map')
from lib.cloud import OEMCloud
from lib.s3map import storage_config
print('imports OK')"
