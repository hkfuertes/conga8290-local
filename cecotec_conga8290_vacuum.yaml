# EXPERIMENTAL: SDK schema + verified LAN status on protocol 3.3.
# Expanded profile loaded in HA; enabled entities have validated read states.
# Physical writes remain untested. No credentials here.
# Optional extensions do not require absent DPs or force additional queries.
# Hidden entities are disabled by default, NOT blocked from writes if enabled.
# Raw map/room/timer/voice payloads need codecs and are deliberately not exposed.
name: Robot vacuum
products:
  - id: kofl9ubyyyfznpxw
    manufacturer: Cecotec
    model: Conga 8290 Immortal Ultra Power
entities:
  - entity: vacuum
    dps:
      - id: 1
        type: boolean
        name: command
        mapping:
          - dps_val: true
            value: start
          - dps_val: false
            value: stop
      # Expected pause semantics (true = paused) still need a physical test.
      - id: 2
        type: boolean
        name: activate
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
      - id: 5
        type: string
        name: status
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: smart
            value: cleaning
          - dps_val: zone_clean
            value: zone cleaning
          - dps_val: paused
            value: paused
          - dps_val: goto_pos
            value: going to location
          - dps_val: pos_arrived
            value: standby
          - dps_val: pos_unarrive
            value: standby
          - dps_val: goto_charge
            value: returning
          - dps_val: charging
            value: charging
          - dps_val: charge_done
            value: docked
          - dps_val: sleep
            value: sleep
          - dps_val: select_room
            value: room cleaning
          - dps_val: part_clean
            value: partial cleaning
          - dps_val: game
            value: game
          - dps_val: mapping
            value: mapping
          - dps_val: collecting_dust
            value: emptying
          - dps_val: manual
            value: manual control
      - id: 9
        type: string
        name: fan_speed
        mapping:
          - dps_val: close
            value: "off"
          - dps_val: gentle
            value: low
          - dps_val: normal
            value: medium
          - dps_val: strong
            value: high
          - dps_val: max
            value: maximum
      - id: 11
        type: boolean
        optional: true
        name: locate
      - id: 28
        type: bitfield
        optional: true
        name: error
        mapping:
          - dps_val: 0
            value: false
          - value: true
  # vacuum.return_to_base is NOT provided: DP3 is an independent button.
  - entity: button
    name: Return to base
    icon: "mdi:home-import-outline"
    dps:
      - id: 3
        type: boolean
        name: button
  - entity: sensor
    class: battery
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: sensor
    name: Cleaning time
    class: duration
    dps:
      - id: 6
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Cleaned area
    class: area
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: m2
        class: measurement
  - entity: select
    translation_key: mopping
    dps:
      - id: 10
        type: string
        name: option
        mapping:
          - dps_val: close
            value: "off"
          - dps_val: low
            value: low
          - dps_val: middle
            value: medium
          - dps_val: high
            value: high

  # Cleaning settings: separate work mode, pattern, water flow and intensity.
  - entity: select
    name: Work mode
    dps:
      - id: 41
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: both_work
            value: Vacuum and mop
          - dps_val: only_sweep
            value: Vacuum only
          - dps_val: only_mop
            value: Mop only
  - entity: select
    name: Cleaning pattern
    dps:
      - id: 105
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: auto
            value: Automatic
          - dps_val: clean_thoroughly
            value: Thorough
          # Preserve the misspellings in the product's wire protocol.
          - dps_val: acrubbing
            value: Scrubbing
          - dps_val: border
            value: Edges
          - dps_val: espiral
            value: Spiral
          - dps_val: espiral_cuadrada
            value: Square spiral
  - entity: select
    name: Mopping intensity
    dps:
      - id: 53
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: slow
            value: Slow
          - dps_val: normal
            value: Normal
          - dps_val: fast
            value: Fast
  - entity: switch
    name: Y-pattern mopping
    dps:
      - id: 104
        type: boolean
        optional: true
        name: switch
  - entity: select
    name: Carpet preference
    category: config
    dps:
      - id: 44
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: adaptive
            value: Adaptive
          - dps_val: evade
            value: Avoid
          - dps_val: ignore
            value: Ignore
  - entity: switch
    name: Carpet suction boost
    category: config
    dps:
      - id: 45
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Resume interrupted cleaning
    category: config
    dps:
      - id: 27
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Do not disturb
    category: config
    dps:
      - id: 25
        type: boolean
        optional: true
        name: switch
  - entity: number
    name: Volume
    category: config
    dps:
      - id: 26
        type: integer
        optional: true
        name: value
        unit: "%"
        range:
          min: 0
          max: 100
        mapping:
          - step: 1
  - entity: switch
    name: Sound
    category: config
    dps:
      - id: 108
        type: boolean
        optional: true
        name: switch
  - entity: switch
    name: Child lock
    category: config
    hidden: true
    dps:
      - id: 47
        type: boolean
        optional: true
        name: switch

  # Read telemetry, including counters marked writable by the SDK schema.
  - entity: sensor
    name: Mop installation
    class: enum
    category: diagnostic
    dps:
      - id: 40
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: none
            value: Not installed
          - dps_val: installed
            value: Installed
  - entity: sensor
    name: Side brush remaining life
    class: duration
    category: diagnostic
    dps:
      - id: 17
        type: integer
        optional: true
        readonly: true
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Main brush remaining life
    class: duration
    category: diagnostic
    dps:
      - id: 19
        type: integer
        optional: true
        readonly: true
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Filter remaining life
    class: duration
    category: diagnostic
    dps:
      - id: 21
        type: integer
        optional: true
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Mop remaining life
    class: duration
    category: diagnostic
    dps:
