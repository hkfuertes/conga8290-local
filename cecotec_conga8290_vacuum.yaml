        type: integer
        optional: true
        name: sensor
        unit: min
        class: measurement
  - entity: sensor
    name: Lifetime cleaned area
    class: area
    category: diagnostic
    dps:
      - id: 29
        type: integer
        optional: true
        name: sensor
        unit: m2
        class: total_increasing
  - entity: sensor
    name: Lifetime cleaning count
    category: diagnostic
    dps:
      - id: 30
        type: integer
        optional: true
        name: sensor
        class: total_increasing
  - entity: sensor
    name: Lifetime cleaning time
    class: duration
    category: diagnostic
    dps:
      - id: 31
        type: integer
        optional: true
        name: sensor
        unit: min
        class: total_increasing
  # Preserve the entire bitmap, including simultaneous faults; no guessed codes.
  - entity: sensor
    name: Fault bitmap
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        optional: true
        readonly: true
        name: sensor
  - entity: sensor
    name: Message report code
    category: diagnostic
    hidden: true
    dps:
      - id: 128
        type: string
        optional: true
        readonly: true
        name: sensor
  - entity: sensor
    name: Game availability
    class: enum
    category: diagnostic
    hidden: true
    dps:
      - id: 120
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: map_unstable
            value: Map unstable
          - dps_val: twice_cleaning_unfinished
            value: Second cleaning unfinished
          - dps_val: allow_play
            value: Available

  # Advanced/schema-only controls: disabled until their app binding is validated.
  # Selecting a navigation mode does NOT supply room IDs, zones or coordinates.
  - entity: select
    name: Operational mode
    hidden: true
    dps:
      - id: 4
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: smart
            value: Automatic
          - dps_val: zone
            value: Zone
          - dps_val: pose
            value: Go to position
          - dps_val: select_room
            value: Selected rooms
          - dps_val: game
            value: Game
          - dps_val: manual
            value: Manual
  # Direction selection sends a movement command; it is not passive telemetry.
  - entity: select
    name: Manual direction
    hidden: true
    dps:
      - id: 12
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: forward
            value: Forward
          - dps_val: backward
            value: Backward
          - dps_val: turn_left
            value: Turn left
          - dps_val: turn_right
            value: Turn right
          - dps_val: stop
            value: Stop
          - dps_val: exit
            value: Exit manual mode
          - dps_val: right_forward
            value: Forward right
          - dps_val: left_forward
