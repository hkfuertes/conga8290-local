            value: Square feet
  - entity: sensor
    name: Estimated area
    class: area
    category: diagnostic
    hidden: true
    dps:
      - id: 43
        type: integer
        optional: true
        name: sensor
        unit: m2
        class: measurement

  # Dust/dock semantics and hardware support are not established for this unit.
  - entity: number
