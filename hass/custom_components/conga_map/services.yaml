refresh_map:
  name: Refresh map
  description: >
    Pide el mapa al robot (get_both), espera la subida a la nube y descarga,
    decodifica y renderiza el PNG. Tarda ~1 minuto.
roomclean:
  name: Clean rooms
  description: >
    Limpia las habitaciones indicadas. ¡MUEVE EL ROBOT físicamente!
  fields:
    rooms:
      name: Rooms
      description: IDs de habitación (ver atributos de los switches Room*)
      required: true
      example: [3, 5]
      selector:
        object:
    passes:
      name: Passes
      description: Pasadas por habitación (1-3)
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 3
          step: 1
