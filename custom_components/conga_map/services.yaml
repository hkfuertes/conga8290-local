refresh_map:
  name: Refresh map
  description: >
    Pide el mapa al robot (get_both), espera la subida a la nube y descarga,
    decodifica y renderiza el PNG. Tarda ~1 minuto.
roomclean:
  name: Clean rooms
  description: >
    Limpia las habitaciones indicadas (frame 0x14 por DP15). ¡MUEVE EL ROBOT!
  fields:
    rooms:
      name: Rooms
      description: IDs de habitación (ver switches Room*) o formato card [{room: N}]
      required: true
      example: [3, 5]
      selector:
        object:
    passes:
      name: Passes
      description: Pasadas por habitación (1-3)
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 3
          step: 1
install_template:
  name: Reinstall tuya_local template
  description: >
    Copia la plantilla YAML del Conga 8290 a custom_components/tuya_local/devices/
    (tuya_local la borra en cada actualización).
