refresh_map:
  name: Refresh map
  description: >
    Requests the map from the robot (get_both), waits for the cloud upload,
    then downloads, decodes and renders the PNG. Takes about a minute.
roomclean:
  name: Clean rooms
  description: >
    Cleans the given rooms (0x14 frame over DP15). WARNING: this MOVES the robot!
  fields:
    rooms:
      name: Rooms
      description: Room IDs (see Room* switches) or card format [{room: N}]
      required: true
      example: [3, 5]
      selector:
        object:
    passes:
      name: Passes
      description: Cleaning passes per room (1-3)
      required: false
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 3
          step: 1
install_template:
  name: Reinstall tuya_local template
  description: >
    Copies the embedded Conga 8290 profile to custom_components/tuya_local/devices/
    (tuya_local wipes that directory on every update).
