# Standard HA cards; no custom card, robot commands or live-refresh claims.
# Change the camera entity to the one created on your HA instance.
views:
  - title: Historical map
    path: map
    cards:
      - type: markdown
        content: >-
          ## Conga 8290 — historical map

          Read-only snapshot from a previous cleaning. No live refresh or room
          controls. Orientation is not yet confirmed.
      - type: picture-entity
        entity: camera.conga_8290_map
        name: Conga 8290 historical map
        show_state: false
        camera_view: auto
        tap_action:
          action: more-info
